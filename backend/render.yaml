services:
  - type: web
    name: charger-assembly-backend
    runtime: node
    region: singapore
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: ADMIN_ID
        sync: false       # Set this manually in Render dashboard
      - key: ADMIN_PASSWORD
        sync: false       # Set this manually in Render dashboard
    # Uncomment below if you add a persistent disk (paid):
    # disk:
    #   name: data-disk
    #   mountPath: /app/data
    #   sizeGB: 1
